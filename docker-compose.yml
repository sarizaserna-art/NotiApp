services:
  backend:
    build: ./backend
    container_name: notiapp_backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: always

  frontend:
    build: ./frontend
    container_name: notiapp_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules  # <--- Esto evita que se sobrescriban los módulos del contenedor
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: always